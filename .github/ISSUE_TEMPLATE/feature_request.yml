name: Feature request
description: Suggest a new feature or a change to the API.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do, and why dixy makes it hard today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How the API could look. A short code example helps most.
    validations:
      required: true
