---
name: Renovate

on:
  schedule:
    - cron: 0 3 * * 1
  workflow_dispatch:

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Update Dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Run Renovate
        uses: renovatebot/github-action@266fef21329c44765ad42f9dea1f01f5d2d91084 # v46.3.13
        with:
          token: ${{ secrets.PAT }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
